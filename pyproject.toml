[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "csql-future"
version = "0.1.0"
description = "A CUBRID SQL shell with searchable history and schema-aware completion."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
csql-future = "csql_future.cli:main"
csqlf = "csql_future.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/csql_future"]
